name: EAS Production Release

# Manual-trigger only, no automatic tag-push trigger. GitHub's required-
# reviewer environment protection needs a paid Team/Enterprise plan, which
# isn't available here - this is the zero-cost equivalent: tag the release
# as usual, then come to the Actions tab and manually run this workflow
# against that tag, rather than a push alone kicking off a production build.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag can point at any commit, including one that never went through
      # main/CI (e.g. a hotfix branch) - verify it here rather than assuming.
      - run: npm run typecheck

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Waits for the build to finish so a follow-up `eas submit` step can be
      # added once Play Console + a service account key are configured.
      - name: Build production AAB on EAS
        run: eas build --platform android --profile prod --non-interactive --wait
