name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - uses: snyk/actions/setup@master

      # Results go to app.snyk.io, not GitHub's Security tab — that requires
      # GitHub Advanced Security, which isn't available on a free plan for a
      # private repo. Non-blocking for now given the size of the existing
      # dependency tree; drop continue-on-error once it's been triaged.
      - name: Snyk Open Source (dependency scan)
        run: snyk test --severity-threshold=high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code (static analysis)
        run: snyk code test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Pushes current results to the Snyk dashboard for ongoing tracking
      # (new vulnerabilities disclosed later still get flagged there).
      - name: Snyk monitor
        run: snyk monitor
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
